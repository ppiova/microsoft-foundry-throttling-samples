name: Local laboratory tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and local HTTP integration
        run: python -B -m unittest discover -s python/tests -v
      - name: Demo console boundaries
        run: |
          python -m pip install -r demo/requirements-cloud.txt
          python -B -m unittest discover -s demo -p 'test_*.py' -v
      - name: Demo client state regressions
        run: node --test demo/test_ui.cjs
      - name: CLI smoke test (local HTTP only)
        run: python -B python/lab.py run --config python/config.example.json --scenario preflight
  dotnet:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test dotnet/FoundryLab.Tests --configuration Release
      - run: dotnet run --project dotnet/FoundryLab --configuration Release -- run --scenario preflight
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: python -B scripts/validate_parity.py
      - shell: pwsh
        run: ./scripts/test_collector.ps1
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - shell: pwsh
        run: |
          az bicep install --version v0.42.1
          if ($LASTEXITCODE -ne 0) { throw 'Bicep install failed' }
          az bicep build --file infra/main.bicep --outfile "$env:RUNNER_TEMP/foundry-lab.json"
          if ($LASTEXITCODE -ne 0) { throw 'Bicep build failed' }
          ./infra/test-infra.ps1
          az bicep build --file infra/hosting.bicep --outfile "$env:RUNNER_TEMP/hosting.json"
          if ($LASTEXITCODE -ne 0) { throw 'Hosting Bicep build failed' }
          az bicep build --file infra/container-app.bicep --outfile "$env:RUNNER_TEMP/container-app.json"
          if ($LASTEXITCODE -ne 0) { throw 'Container App Bicep build failed' }

      - name: Analyze Bicep with PSRule for Azure
        uses: microsoft/ps-rule@46451b8f5258c41beb5ae69ed7190ccbba84112c # v2.9.0
        # The upload below is skipped for forks, so a rule failure has to surface
        # as a failing step rather than only as a code-scanning alert nobody reads.
        continue-on-error: false
        with:
          modules: PSRule.Rules.Azure
          inputPath: infra/
          outputFormat: Sarif
          outputPath: reports/ps-rule.sarif

      # A pull request from a fork gets a read-only token, so uploading SARIF fails
      # there regardless of the permissions this job requests. Skipping it keeps a
      # first-time contributor from seeing a red check they cannot fix. The
      # expression is used rather than a hardcoded repository name on purpose:
      # hardcoding one silently disables the upload the moment the repository is
      # renamed or transferred, which is exactly what is planned here.
      - name: Upload PSRule results to code scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: reports/ps-rule.sarif
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build -t foundry-lab:test .
      - name: Container starts and denies unconfigured access
        shell: bash
        run: |
          docker run -d --name lab -p 127.0.0.1:8080:8080 foundry-lab:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 503
          docker exec lab dotnet /app/published/FoundryLab.dll run --config /app/dotnet/config.example.json --scenario preflight --out /data/dotnet/runs
          docker exec lab python /app/python/lab.py run --config /app/python/config.example.json --scenario preflight --out /data/python/runs
      - name: Local Compose workflow and persistent evidence
        run: |
          docker compose up --build -d --wait
          python scripts/test_compose.py
      - name: Stop local Compose service
        if: always()
        run: docker compose down
